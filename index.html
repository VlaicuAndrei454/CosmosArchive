<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #f8f9fa; /* Aproape de alb pur pentru contrast */
            --text-muted: #63b3ed;  /* Albastru deschis pentru accente */
            --nasa-gray: #cbd5e0;   /* Gri deschis pentru text lung */
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--accent-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, .display-date { font-family: 'Playfair Display', serif; }

        /* Stil pentru Input - Minimalist */
        input[type="date"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid #333;
            border-radius: 0;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            padding: 10px;
            color-scheme: dark; /* Face iconița de calendar albă pe unele browsere */
        }
        input[type="date"]:focus { background: transparent; color: white; border-color: white; box-shadow: none; outline: none; }

        .btn-explore {
            border: 1px solid white;
            background: transparent;
            color: white;
            padding: 12px 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s;
            margin-top: 20px;
        }
        .btn-explore:hover { background: white; color: black; }

        /* Imaginea NASA - Hero Style */
        .img-container {
            position: relative;
            margin-top: 50px;
            opacity: 0;
            transition: opacity 1s ease-in;
            display: none;
        }
        #nasaImage {
            width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
        }

        /* Textul Istoric - Editorial Style */
        .history-overlay {
            border-left: 2px solid #333;
            padding-left: 35px;
            margin-top: 20px;
        }

        .date-label { 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-size: 0.75rem; 
            font-weight: 600;
        }

        #historyFact {
            font-size: 2rem;
            color: white;
            line-height: 1.3;
            margin-bottom: 3rem !important;
        }

        #nasaTitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        #nasaDescription {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--nasa-gray);
            font-weight: 300;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 15px;
            text-align: justify;
        }

        /* Scrollbar personalizat */
        #nasaDescription::-webkit-scrollbar { width: 3px; }
        #nasaDescription::-webkit-scrollbar-track { background: transparent; }
        #nasaDescription::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

        .loader-line {
            width: 0;
            height: 2px;
            background: white;
            position: fixed;
            top: 0; left: 0;
            transition: width 0.5s;
            z-index: 9999;
        }
    </style>
</head>
<body>

<div class="loader-line" id="loader"></div>

<div class="container min-vh-100 d-flex flex-column justify-content-center pb-5">
    <div class="row pt-5">
        <div class="col-12 text-center">
            <span class="date-label mb-3 d-block">Arhiva Timpului</span>
            <h1 class="display-1 mb-4">Cosmos Archive</h1>
            
            <div class="mt-4 mb-5">
                <input type="date" id="dateInput">
                <br>
                <button id="travelBtn" class="btn btn-explore">Caută în trecut</button>
            </div>
        </div>
    </div>

    <div id="resultArea" class="img-container container-fluid">
        <div class="row align-items-start">
            <div class="col-lg-7 mb-5">
                <img id="nasaImage" src="" alt="NASA Content">
            </div>
            <div class="col-lg-5">
                <div class="history-overlay">
                    <span class="date-label d-block mb-2">Fapt Istoric</span>
                    <p id="historyFact" class="font-italic"></p>
                    
                    <span class="date-label d-block mb-2">Explicație Cosmică</span>
                    <h3 id="nasaTitle"></h3>
                    <div id="nasaDescription"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script src="config.js"></script>
</body>
</html>
